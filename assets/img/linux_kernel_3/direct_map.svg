<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Segoe UI', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="880" height="448" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="450" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">Direct Map (physmap) 구조</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#6b7280">RAM 전체를 page_offset_base 부터 그대로 1:1 매핑한 "거울"</text>

  <!-- physical bar -->
  <text x="90" y="90" font-size="12" font-weight="700" fill="#6b7280">물리 메모리 RAM</text>
  <text x="470" y="90" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">물리주소 phys</text>
  <text x="810" y="90" text-anchor="end" font-size="11" fill="#6b7280">RAM 끝</text>
  <rect x="90" y="100" width="720" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/>
  <rect x="452" y="100" width="36" height="52" fill="#fef3e0" stroke="#f59e0b" stroke-width="2"/>
  <text x="98" y="131" font-size="11" font-family="monospace" fill="#6b7280">0</text>

  <!-- connectors (parallel shift) -->
  <line x1="90"  y1="152" x2="90"  y2="290" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="810" y1="152" x2="810" y2="290" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="470" y1="152" x2="470" y2="290" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="266" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">+ page_offset_base</text>
  <text x="266" y="233" text-anchor="middle" font-size="11" fill="#6b7280">평행 이동 · 1:1 선형(linear)</text>

  <!-- direct map bar -->
  <text x="90" y="282" font-size="12" font-weight="700" fill="#1a8a4e">direct map (커널 가상주소)</text>
  <rect x="90" y="290" width="720" height="52" rx="6" fill="#e6f6ec" stroke="#1a9c54" stroke-width="1.5"/>
  <rect x="452" y="290" width="36" height="52" fill="#fef3e0" stroke="#f59e0b" stroke-width="2"/>
  <line x1="90" y1="286" x2="90" y2="346" stroke="#1a9c54" stroke-width="2.5"/>

  <!-- bottom labels -->
  <text x="90"  y="362" text-anchor="start"  font-size="10.5" font-family="monospace" fill="#1a8a4e">page_offset_base (= phys 0)</text>
  <text x="470" y="362" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="700" fill="#b45309">page_offset_base + phys</text>
  <text x="810" y="362" text-anchor="end"    font-size="10.5" font-family="monospace" fill="#6b7280">page_offset_base + 끝</text>

  <!-- formula -->
  <rect x="90" y="376" width="720" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="400" text-anchor="middle" font-size="13" font-family="monospace" font-weight="700" fill="#1f2937">direct-map VA = page_offset_base + 물리주소</text>
  <text x="450" y="422" text-anchor="middle" font-size="13" font-family="monospace" fill="#374151">물리주소 = VA − page_offset_base</text>

  <!-- footnote -->
  <text x="450" y="452" text-anchor="middle" font-size="10.5" fill="#94a3b8">※ struct page 메타데이터 배열(vmemmap)은 이 영역과 별개다</text>
</svg>
