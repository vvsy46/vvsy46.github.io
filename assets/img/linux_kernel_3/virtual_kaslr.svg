<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="'Segoe UI', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="840" height="380" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="430" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">Virtual KASLR</text>
  <text x="430" y="70" text-anchor="middle" font-size="13" fill="#6b7280">모든 심볼이 같은 slide 만큼 이동한다</text>

  <!-- static panel -->
  <rect x="50" y="96" width="310" height="200" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="205" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1a73e8">정적 (vmlinux)</text>
  <text x="68" y="160" font-size="11.5" font-family="monospace" fill="#374151">_text          0xffffffff81000000</text>
  <text x="68" y="196" font-size="11.5" font-family="monospace" fill="#374151">commit_creds   0xffffffff810c9b40</text>
  <text x="68" y="232" font-size="11.5" font-family="monospace" fill="#374151">modprobe_path  0xffffffff8293d240</text>
  <text x="205" y="272" text-anchor="middle" font-size="11" fill="#6b7280">정적 분석 기준 고정 주소</text>

  <!-- runtime panel -->
  <rect x="500" y="96" width="310" height="200" rx="10" fill="#e6f6ec" stroke="#1a9c54" stroke-width="1.5"/>
  <text x="655" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1a8a4e">런타임 (부팅 후)</text>
  <text x="516" y="160" font-size="11.5" font-family="monospace" fill="#374151">_text          + slide</text>
  <text x="516" y="196" font-size="11.5" font-family="monospace" fill="#374151">commit_creds   + slide</text>
  <text x="516" y="232" font-size="11.5" font-family="monospace" fill="#374151">modprobe_path  + slide</text>
  <text x="655" y="272" text-anchor="middle" font-size="11" fill="#6b7280">실제 배치된 가상 주소</text>

  <!-- arrow -->
  <line x1="362" y1="196" x2="500" y2="196" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="431" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">+ virtual slide</text>
  <text x="431" y="216" text-anchor="middle" font-size="11" fill="#6b7280">(KASLR)</text>

  <!-- formula -->
  <rect x="50" y="316" width="760" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="342" text-anchor="middle" font-size="13.5" font-family="monospace" font-weight="700" fill="#1f2937">virtual slide = leaked runtime address − static symbol address</text>
  <text x="430" y="364" text-anchor="middle" font-size="12" fill="#6b7280">커널 포인터를 leak한 뒤 알고 있는 정적 주소를 빼서 구한다</text>
</svg>
