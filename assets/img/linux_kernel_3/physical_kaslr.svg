<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="'Segoe UI', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="840" height="450" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="430" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">Physical KASLR</text>
  <text x="430" y="70" text-anchor="middle" font-size="13" fill="#6b7280">가상 slide 와 물리 slide 는 서로 독립적인 값이다</text>

  <!-- virtual space -->
  <text x="56" y="104" font-size="12" font-weight="600" fill="#6b7280">가상 주소 공간  (virtual slide 로 이동)</text>
  <rect x="50" y="110" width="760" height="54" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="330" y="110" width="200" height="54" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="430" y="142" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">kernel image</text>
  <line x1="500" y1="106" x2="500" y2="168" stroke="#e5484d" stroke-width="2"/>
  <text x="500" y="101" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e5484d">modprobe_path</text>
  <text x="330" y="184" font-size="11" font-family="monospace" fill="#374151">virtual base = 0xffffffff81000000 + virtual slide</text>

  <!-- offset note -->
  <text x="430" y="210" text-anchor="middle" font-size="12" fill="#6b7280">이미지 내부 offset = 0x193d240 — KASLR 과 무관하게 항상 일정</text>

  <!-- physical RAM -->
  <text x="56" y="244" font-size="12" font-weight="600" fill="#6b7280">물리 메모리 (RAM)  (physical slide 로 이동)</text>
  <rect x="50" y="250" width="760" height="54" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="170" y="250" width="200" height="54" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="270" y="282" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">kernel image</text>
  <line x1="340" y1="246" x2="340" y2="308" stroke="#e5484d" stroke-width="2"/>
  <text x="340" y="241" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e5484d">modprobe_path</text>
  <text x="170" y="324" font-size="11" font-family="monospace" fill="#374151">physical base = 0x01000000 + physical slide</text>

  <!-- why only physical slide (note) -->
  <rect x="50" y="338" width="760" height="42" rx="8" fill="#fff8e6" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="70" y="356" font-size="12" font-weight="700" fill="#b45309">왜 물리주소엔 physical slide 만 나올까?</text>
  <text x="70" y="373" font-size="11.5" fill="#7a5b12">물리주소는 물리 배치(physical base)로만 결정된다. virtual slide 는 가상주소에만 영향을 주고, 이미지 내부 offset 은 고정이라 식에서 사라진다.</text>

  <!-- formula -->
  <rect x="50" y="388" width="760" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="412" text-anchor="middle" font-size="13" font-family="monospace" font-weight="700" fill="#1f2937">modprobe physical address = kernel physical base + 0x193d240</text>
  <text x="430" y="434" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#374151">= 0x01000000 + physical slide + 0x193d240   (virtual slide 무관)</text>
</svg>
