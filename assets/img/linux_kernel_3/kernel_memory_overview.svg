<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" font-family="'Segoe UI', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a9c54"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="900" height="520" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="460" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937">같은 modprobe_path — 어느 주소에 덮어야 하나?</text>
  <text x="460" y="64" text-anchor="middle" font-size="12.5" fill="#6b7280">주소 3개는 전부 다른 값. ①·②는 같은 문자열(덮으면 됨) · ③은 메타데이터(덮으면 안 됨)</text>

  <!-- ① handle -->
  <rect x="40" y="92" width="290" height="92" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="58" y="116" font-size="13" font-weight="700" fill="#1a73e8">① kernel image VA</text>
  <text x="58" y="138" font-size="12" font-family="monospace" fill="#374151">0xffffffff8473d240</text>
  <rect x="58" y="150" width="254" height="24" rx="6" fill="#d7f5e0" stroke="#1a9c54"/>
  <text x="185" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#1a8a4e">✅ 여기 덮으면 modprobe_path 바뀜</text>

  <!-- ② handle -->
  <rect x="40" y="196" width="290" height="92" rx="10" fill="#e6f6ec" stroke="#1a9c54" stroke-width="1.5"/>
  <text x="58" y="220" font-size="13" font-weight="700" fill="#1a8a4e">② direct-map VA</text>
  <text x="58" y="242" font-size="12" font-family="monospace" fill="#374151">0xffff888005d3d240</text>
  <rect x="58" y="254" width="254" height="24" rx="6" fill="#d7f5e0" stroke="#1a9c54"/>
  <text x="185" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#1a8a4e">✅ 여기 덮으면 modprobe_path 바뀜</text>

  <!-- ③ handle -->
  <rect x="40" y="300" width="290" height="92" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="58" y="324" font-size="13" font-weight="700" fill="#475569">③ struct page*</text>
  <text x="58" y="346" font-size="12" font-family="monospace" fill="#374151">0xffffea0000174f40</text>
  <rect x="58" y="358" width="254" height="24" rx="6" fill="#fde2e1" stroke="#e5484d"/>
  <text x="185" y="374" text-anchor="middle" font-size="11" font-weight="700" fill="#c0362f">❌ 여기 덮으면 안 됨 (메타데이터)</text>

  <!-- Box A: real string bytes -->
  <rect x="470" y="100" width="410" height="150" rx="12" fill="#fff8e6" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="490" y="126" font-size="13.5" font-weight="700" fill="#b45309">modprobe_path 문자열 (실제 바이트)</text>
  <text x="490" y="147" font-size="11" font-family="monospace" fill="#8a6d1a">물리주소 P = 0x05d3d240  (RAM 안)</text>
  <rect x="490" y="160" width="370" height="46" rx="8" fill="#ffffff" stroke="#f0b429" stroke-width="1.3"/>
  <text x="675" y="189" text-anchor="middle" font-size="13" font-family="monospace" font-weight="700" fill="#1f2937">"/sbin/modprobe\0"  →  "/tmp/x\0"</text>
  <text x="490" y="233" font-size="12" font-weight="700" fill="#1a8a4e">↑ ①·② 가 가리키는 같은 곳 — 여기를 덮는다</text>

  <!-- Box B: metadata -->
  <rect x="470" y="300" width="410" height="95" rx="12" fill="#eef1f4" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="490" y="326" font-size="13" font-weight="700" fill="#475569">struct page[PFN] (메타데이터)</text>
  <text x="490" y="348" font-size="11.5" fill="#64748b">flags · refcount · mapping …  (문자열 아님)</text>
  <text x="490" y="372" font-size="11.5" font-weight="700" fill="#c0362f">③ 는 여기를 가리킴 → 덮는 곳 아님</text>
  <text x="490" y="388" font-size="11" fill="#475569">대신 PFN·page_address 계산으로 ② 주소를 구함</text>

  <!-- arrows handles -> boxes -->
  <line x1="330" y1="138" x2="470" y2="150" stroke="#1a9c54" stroke-width="2.2" marker-end="url(#arg)"/>
  <line x1="330" y1="242" x2="470" y2="196" stroke="#1a9c54" stroke-width="2.2" marker-end="url(#arg)"/>
  <line x1="330" y1="346" x2="470" y2="345" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- dashed B -> A (계산) -->
  <line x1="610" y1="300" x2="610" y2="250" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <rect x="626" y="262" width="150" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="701" y="277" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">계산: ③ → ② 주소</text>

  <!-- bottom summary -->
  <rect x="40" y="410" width="840" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="460" y="435" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">P(물리주소)는 CPU가 직접 못 건드림 → 반드시 가상주소로 바꿔서 접근</text>
  <text x="460" y="460" text-anchor="middle" font-size="11.5" fill="#374151">· 가상주소 write 가능(ROP 등) → ① 에 바로 쓴다</text>
  <text x="460" y="480" text-anchor="middle" font-size="11.5" fill="#374151">· 물리 / struct page write → P 를 ② 로, 또는 ③ → ② 로 변환해서 쓴다</text>
  <text x="460" y="499" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">결국 덮는 자리는 언제나 ①·② (문자열이 있는 곳)</text>
</svg>
