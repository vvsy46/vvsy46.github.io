<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="'Segoe UI', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="900" height="400" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="460" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">vmemmap (struct page 배열)</text>
  <text x="460" y="70" text-anchor="middle" font-size="13" fill="#6b7280">PFN 으로 struct page ↔ physical page 가 1:1 대응</text>

  <!-- vmemmap row -->
  <text x="60" y="112" font-size="12" font-weight="600" fill="#6b7280">vmemmap : struct page[] (각 0x40 B)</text>
  <text x="272" y="146" text-anchor="end" font-size="11" font-weight="600" fill="#1a73e8">vmemmap_base →</text>

  <rect x="276" y="120" width="64" height="46" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.3"/>
  <text x="308" y="148" text-anchor="middle" font-size="11" fill="#374151">PFN 0</text>
  <rect x="352" y="120" width="64" height="46" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.3"/>
  <text x="384" y="148" text-anchor="middle" font-size="11" fill="#374151">PFN 1</text>
  <rect x="428" y="120" width="64" height="46" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.3"/>
  <text x="460" y="148" text-anchor="middle" font-size="11" fill="#374151">PFN 2</text>
  <rect x="504" y="120" width="64" height="46" rx="6" fill="#fef3e0" stroke="#f59e0b" stroke-width="2.2"/>
  <text x="536" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">PFN 3</text>
  <rect x="580" y="120" width="64" height="46" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.3"/>
  <text x="612" y="148" text-anchor="middle" font-size="11" fill="#374151">PFN 4</text>

  <!-- connectors -->
  <line x1="308" y1="166" x2="308" y2="278" stroke="#d1d5db" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="384" y1="166" x2="384" y2="278" stroke="#d1d5db" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="460" y1="166" x2="460" y2="278" stroke="#d1d5db" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="536" y1="166" x2="536" y2="278" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="612" y1="166" x2="612" y2="278" stroke="#d1d5db" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="548" y="226" font-size="11.5" font-weight="700" fill="#b45309">PFN = 3</text>

  <!-- physical row -->
  <text x="60" y="272" font-size="12" font-weight="600" fill="#6b7280">물리 메모리 : page (각 0x1000 B)</text>
  <rect x="276" y="280" width="64" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="352" y="280" width="64" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="428" y="280" width="64" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="504" y="280" width="64" height="46" rx="6" fill="#fef3e0" stroke="#f59e0b" stroke-width="2.2"/>
  <text x="536" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">page</text>
  <rect x="580" y="280" width="64" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- formula -->
  <rect x="60" y="344" width="800" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="460" y="366" text-anchor="middle" font-size="12.5" font-family="monospace" font-weight="700" fill="#1f2937">struct page 주소 = vmemmap_base + PFN × 0x40</text>
  <text x="460" y="386" text-anchor="middle" font-size="12" font-family="monospace" fill="#374151">physical = PFN × 0x1000     page_address = page_offset_base + PFN × 0x1000</text>
</svg>
