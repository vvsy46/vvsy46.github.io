<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="'Segoe UI', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="10" y="10" width="880" height="720" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- title -->
  <text x="450" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">modprobe_path 를 통한 LPE</text>
  <text x="450" y="72" text-anchor="middle" font-size="13" fill="#6b7280">overwrite  →  알 수 없는 포맷 실행  →  커널이 modprobe_path 를 root 로 실행</text>

  <!-- ===== ① 사전 준비 ===== -->
  <text x="60" y="108" font-size="14" font-weight="700" fill="#1a73e8">① 사전 준비 (일반 유저)</text>

  <!-- B1 -->
  <rect x="170" y="116" width="560" height="56" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="450" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">modprobe_path 덮어쓰기 (arbitrary write)</text>
  <text x="450" y="160" text-anchor="middle" font-size="13" font-family="monospace" fill="#374151">"/sbin/modprobe"   →   "/tmp/x"</text>

  <line x1="450" y1="172" x2="450" y2="186" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B2 -->
  <rect x="170" y="188" width="560" height="56" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="450" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">/tmp/x 생성</text>
  <text x="450" y="232" text-anchor="middle" font-size="13" fill="#374151">root 로 실행될 스크립트  +  chmod +x</text>

  <line x1="450" y1="244" x2="450" y2="258" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B3 -->
  <rect x="170" y="260" width="560" height="56" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="450" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">/tmp/trigger 생성</text>
  <text x="450" y="304" text-anchor="middle" font-size="13" font-family="monospace" fill="#374151">매직 깨진 실행파일  \xff\xff\xff\xff   +  chmod +x</text>

  <line x1="450" y1="316" x2="450" y2="338" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== ② 트리거 ===== -->
  <text x="60" y="360" font-size="14" font-weight="700" fill="#d9820a">② 트리거</text>

  <!-- B4 -->
  <rect x="170" y="340" width="560" height="52" rx="10" fill="#fef3e0" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="363" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937" font-family="monospace">execve("/tmp/trigger")</text>
  <text x="450" y="382" text-anchor="middle" font-size="12.5" fill="#374151">포맷 인식 실패 (ENOEXEC) — 실행 성공 여부는 무관</text>

  <line x1="450" y1="392" x2="450" y2="426" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== ③ 커널 내부 ===== -->
  <text x="60" y="448" font-size="14" font-weight="700" fill="#d1383d">③ 커널 내부 (root)</text>

  <!-- B5 -->
  <rect x="170" y="428" width="560" height="48" rx="10" fill="#fdecea" stroke="#e5484d" stroke-width="1.5"/>
  <text x="450" y="457" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan font-family="monospace" font-weight="600">search_binary_handler</tspan> : 모든 binfmt 핸들러 실패</text>

  <line x1="450" y1="476" x2="450" y2="490" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B6 -->
  <rect x="170" y="492" width="560" height="48" rx="10" fill="#fdecea" stroke="#e5484d" stroke-width="1.5"/>
  <text x="450" y="521" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">request_module("binfmt-ffff")  →  call_modprobe()</text>

  <line x1="450" y1="540" x2="450" y2="554" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B7 -->
  <rect x="170" y="556" width="560" height="56" rx="10" fill="#fdecea" stroke="#e5484d" stroke-width="2"/>
  <text x="450" y="580" text-anchor="middle" font-size="13.5" font-family="monospace" font-weight="600" fill="#1f2937">call_usermodehelper(modprobe_path)</text>
  <text x="450" y="600" text-anchor="middle" font-size="13" fill="#b3261e" font-weight="700">= /tmp/x 를 root 로 실행  ⚑</text>

  <line x1="450" y1="612" x2="450" y2="642" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== ④ 결과 ===== -->
  <text x="60" y="678" font-size="14" font-weight="700" fill="#1a8a4e">④ 결과</text>

  <!-- B8 -->
  <rect x="170" y="644" width="560" height="60" rx="10" fill="#e6f6ec" stroke="#1a9c54" stroke-width="2"/>
  <text x="450" y="670" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">/tmp/x 가 root 권한으로 실행됨</text>
  <text x="450" y="691" text-anchor="middle" font-size="14" font-weight="700" fill="#1a8a4e">→ Local Privilege Escalation</text>
</svg>
